name: Build and Release

# Cuts a Flycut release when a version tag (e.g. v1.9.7) is pushed.
#
# Behaviour degrades gracefully by which secrets are configured:
#   - No secrets            -> ad-hoc signed .app in the DMG (Gatekeeper will warn; for testing only)
#   - Signing secrets       -> Developer ID signed, hardened runtime (still Gatekeeper-warned until notarized)
#   - Signing + notary      -> Developer ID signed + notarized + stapled (clean install, no warning)
#
# Required secrets for a proper release (see RELEASE_SETUP.md):
#   CERTIFICATES_P12         base64 of your "Developer ID Application" .p12
#   CERTIFICATES_PASSWORD    password for that .p12
#   NOTARY_APPLE_ID          Apple ID email used for notarization
#   NOTARY_APP_PASSWORD      app-specific password for that Apple ID
#   NOTARY_TEAM_ID           your Apple Developer Team ID (e.g. S8JLSG5ES7)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    env:
      HAS_CERTIFICATES: ${{ secrets.CERTIFICATES_P12 != '' }}
      HAS_NOTARY: ${{ secrets.NOTARY_APPLE_ID != '' && secrets.NOTARY_APP_PASSWORD != '' && secrets.NOTARY_TEAM_ID != '' }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0   # full history so changelog/version derivation works

    - name: Set up Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Extract version from tag
      id: get_version
      run: |
        if [[ "$GITHUB_REF" == refs/tags/* ]]; then
          VERSION="${GITHUB_REF#refs/tags/}"; VERSION="${VERSION#v}"
        else
          VERSION="$(git describe --tags --always 2>/dev/null || echo dev)"
        fi
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "Building version: $VERSION"

    - name: Stamp version into the project
      run: |
        VERSION="${{ steps.get_version.outputs.version }}"
        # Keep the user-facing version in sync with the tag (numeric x.y.z only).
        if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
          /usr/bin/sed -i '' "s/MARKETING_VERSION = [0-9.]*;/MARKETING_VERSION = ${VERSION};/g" Flycut.xcodeproj/project.pbxproj
          echo "Stamped MARKETING_VERSION = $VERSION"
        else
          echo "Tag '$VERSION' is not x.y.z; leaving MARKETING_VERSION as committed."
        fi

    - name: Import Developer ID certificate
      if: env.HAS_CERTIFICATES == 'true'
      env:
        CERTIFICATES_P12: ${{ secrets.CERTIFICATES_P12 }}
        CERTIFICATES_PASSWORD: ${{ secrets.CERTIFICATES_PASSWORD }}
      run: |
        KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
        KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
        security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        echo "$CERTIFICATES_P12" | base64 --decode > certificate.p12
        security import certificate.p12 -k "$KEYCHAIN_PATH" -P "$CERTIFICATES_PASSWORD" \
          -T /usr/bin/codesign -T /usr/bin/productsign
        security list-keychain -d user -s "$KEYCHAIN_PATH"
        security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        rm certificate.p12
        IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep 'Developer ID Application' | head -1 | sed -E 's/.*"(.*)"/\1/')"
        echo "SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
        echo "Using identity: $IDENTITY"

    - name: Build and archive
      run: |
        if [ -n "$SIGNING_IDENTITY" ]; then
          xcodebuild -project Flycut.xcodeproj -scheme Flycut -configuration Release \
            -archivePath build/Flycut.xcarchive archive \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="$SIGNING_IDENTITY" \
            DEVELOPMENT_TEAM="${{ secrets.NOTARY_TEAM_ID }}" \
            OTHER_CODE_SIGN_FLAGS="--timestamp --options runtime"
        else
          echo "::warning::No Developer ID certificate configured - building ad-hoc (test build only)."
          xcodebuild -project Flycut.xcodeproj -scheme Flycut -configuration Release \
            -archivePath build/Flycut.xcarchive archive \
            CODE_SIGNING_ALLOWED=NO
        fi

    - name: Export app from archive
      run: |
        mkdir -p build/Export
        cp -R build/Flycut.xcarchive/Products/Applications/Flycut.app build/Export/
        if [ -z "$SIGNING_IDENTITY" ]; then
          codesign --force --deep --sign - build/Export/Flycut.app
        fi
        codesign -dv --verbose=2 build/Export/Flycut.app || true

    - name: Create DMG
      run: |
        mkdir -p build/dmg-staging
        cp -R build/Export/Flycut.app build/dmg-staging/
        ln -s /Applications build/dmg-staging/Applications
        hdiutil create -volname "Flycut" -srcfolder build/dmg-staging \
          -ov -format UDZO "$PWD/build/Flycut.dmg"
        ls -lh build/Flycut.dmg

    - name: Notarize and staple
      if: env.HAS_NOTARY == 'true' && env.SIGNING_IDENTITY != ''
      env:
        NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
        NOTARY_APP_PASSWORD: ${{ secrets.NOTARY_APP_PASSWORD }}
        NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
      run: |
        echo "Submitting DMG to Apple notary service..."
        xcrun notarytool submit build/Flycut.dmg \
          --apple-id "$NOTARY_APPLE_ID" \
          --password "$NOTARY_APP_PASSWORD" \
          --team-id "$NOTARY_TEAM_ID" \
          --wait
        xcrun stapler staple build/Flycut.dmg
        xcrun stapler validate build/Flycut.dmg
        echo "Notarized and stapled."

    - name: Clean up keychain
      if: always()
      run: security delete-keychain "$RUNNER_TEMP/build.keychain" 2>/dev/null || true

    - name: Assemble release notes
      run: |
        VERSION="${{ steps.get_version.outputs.version }}"
        # Prefer a curated section from CHANGELOG.md; fall back to the commit log.
        NOTES=""
        if [ -f CHANGELOG.md ]; then
          NOTES="$(awk -v v="$VERSION" '
            $0 ~ "^## " && $0 ~ v {grab=1; next}
            grab && /^## / {exit}
            grab {print}' CHANGELOG.md)"
        fi
        if [ -z "$NOTES" ]; then
          PREV_TAG="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo '')"
          if [ -z "$PREV_TAG" ]; then
            NOTES="$(git log --pretty=format:'- %s (%h)' --reverse)"
          else
            NOTES="$(git log "${PREV_TAG}..HEAD" --pretty=format:'- %s (%h)' --reverse)"
          fi
        fi
        if [ "$HAS_NOTARY" = 'true' ] && [ -n "$SIGNING_IDENTITY" ]; then SIGN="Developer ID signed + notarized";
        elif [ -n "$SIGNING_IDENTITY" ]; then SIGN="Developer ID signed (not notarized)";
        else SIGN="ad-hoc signed (test build)"; fi
        {
          echo "$NOTES"
          echo ""
          echo "## Installation"
          echo "1. Download the DMG below, open it, and drag Flycut to Applications."
          echo "2. Launch Flycut and grant Accessibility permission when prompted"
          echo "   (System Settings > Privacy & Security > Accessibility)."
          echo ""
          echo "**Upgrading and paste stopped working?** Reset the permission and re-grant it:"
          echo '```'
          echo "tccutil reset Accessibility com.generalarcade.flycut"
          echo '```'
          echo ""
          echo "_Build: $SIGN._"
        } > release_notes.md
        cat release_notes.md

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: build/Flycut.dmg
        body_path: release_notes.md
        name: Flycut ${{ steps.get_version.outputs.version }}
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
