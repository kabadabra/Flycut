name: macOS build

on:
  push:
    branches: [master, main, feat/swift-rewrite]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  swift:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.0'
      - run: swift test
      - run: scripts/build-app.sh debug
      - run: scripts/build-app.sh release
      - run: scripts/verify-app.sh build/Export/Flycut.app

  # Retain until the Swift migration, UI and installation QA gates pass.
  legacy-2:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.0'
      - name: Build historical Flycut 2.0
        run: |
          xcodebuild -project Flycut.xcodeproj -scheme Flycut \
            -configuration Debug -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO build
